name: PlatformIO CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for firmware or release workflow changes
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -Eq "^(Software/|\.github/scripts/|\.github/workflows/)"; then
            echo "Firmware-affecting changes detected"
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "No firmware-affecting changes detected, skipping build"
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            flash_size: 16MB
          - environment: production
            flash_size: 16MB
          - environment: staging_4mb
            flash_size: 4MB
          - environment: production_4mb
            flash_size: 4MB
    env:
      PIO_ENV: ${{ matrix.environment }}
      RELEASE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        working-directory: Software
        run: |
          pio run -e "$PIO_ENV" -t buildprog

      - name: Verify flash profile and build merged web installer
        env:
          FLASH_SIZE: ${{ matrix.flash_size }}
        run: |
          python .github/scripts/build_web_installer.py \
            --build-dir "Software/.pio/build/$PIO_ENV" \
            --output "Software/.pio/build/$PIO_ENV/web-installer.bin" \
            --flash-size "$FLASH_SIZE"

      - name: Verify current build identity and Bluetooth
        run: |
          EXPECTED_VERSION="$(python scripts/release_version.py read --header Software/src/constants/Version.h)"
          grep -aFq "$RELEASE_BUILD_SHA" "Software/.pio/build/$PIO_ENV/firmware.bin"
          grep -aFq "$EXPECTED_VERSION" "Software/.pio/build/$PIO_ENV/firmware.bin"
          grep -qx 'CONFIG_BT_ENABLED=y' "Software/sdkconfig.$PIO_ENV"
          ~/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm \
            "Software/.pio/build/$PIO_ENV/firmware.elf" | grep -E 'NimBLEServer' > /dev/null

      - name: Upload firmware and size evidence
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            Software/.pio/build/${{ matrix.environment }}/firmware.bin
            Software/.pio/build/${{ matrix.environment }}/firmware.elf
            Software/.pio/build/${{ matrix.environment }}/Software.map
            Software/.pio/build/${{ matrix.environment }}/partitions.bin
            Software/.pio/build/${{ matrix.environment }}/bootloader.bin
            Software/.pio/build/${{ matrix.environment }}/web-installer.bin
          if-no-files-found: error
          retention-days: 1

  check:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Check PlatformIO Project
        run: |
          cd Software
          pio check --skip-packages --fail-on-defect high -e production -f src

  test:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Unit Test PlatformIO Project
        run: |
          cd Software
          pio test -e test

      - name: Test firmware artifacts and release gates
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python scripts/test_release_version.py

  check_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify restored safety documentation
        run: |
          if [[ ! -s Documentation/Hazards.md || ! -s "Documentation/Safety and Design Guide.md" ]]; then
            echo "Required safety documentation is missing or empty"
            exit 1
          fi
