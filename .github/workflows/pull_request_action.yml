name: PlatformIO CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for firmware or release workflow changes
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -Eq "^(Software/|\.github/scripts/|\.github/workflows/)"; then
            echo "Firmware-affecting changes detected"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "No firmware-affecting changes detected, skipping build"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: |
          cd Software
          pio run -e staging-v1 -j 1
          pio run -e staging-v2 -j 1
          pio run -e production-v1 -j 1
          pio run -e production-v2 -j 1

      - name: Build merged web installers
        run: |
          python .github/scripts/build_web_installer.py \
            --profile esp32-4mb \
            --build-dir "Software/.pio/build/production-v1" \
            --output "Software/.pio/build/production-v1/web-installer.bin"
          python .github/scripts/build_web_installer.py \
            --profile esp32-16mb \
            --build-dir "Software/.pio/build/production-v2" \
            --output "Software/.pio/build/production-v2/web-installer.bin"

      - name: Verify V1 omits Bluetooth
        run: |
          grep -qx '# CONFIG_BT_ENABLED is not set' Software/sdkconfig.production-v1
          grep -qx 'CONFIG_BT_ENABLED=y' Software/sdkconfig.production-v2
          if ~/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm \
            Software/.pio/build/production-v1/firmware.elf | \
            grep -Eq 'NimBLE|initRadBle|radBleServer'; then
            echo "V1 unexpectedly contains Bluetooth symbols" >&2
            exit 1
          fi

      - name: Test immutable publisher
        run: |
          python .github/scripts/test_download_verified_release.py
          python .github/scripts/test_build_web_installer.py
          python .github/scripts/test_publish_immutable_firmware.py
          python .github/scripts/test_release_workflow.py

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            Software/.pio/build/production-v1/firmware.bin
            Software/.pio/build/production-v1/partitions.bin
            Software/.pio/build/production-v1/bootloader.bin
            Software/.pio/build/production-v1/web-installer.bin
            Software/.pio/build/production-v2/firmware.bin
            Software/.pio/build/production-v2/partitions.bin
            Software/.pio/build/production-v2/bootloader.bin
            Software/.pio/build/production-v2/web-installer.bin
          retention-days: 1

  check:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Check PlatformIO Project
        run: |
          cd Software
          pio check --skip-packages --fail-on-defect high -e production-v2 -f src

  test:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Unit Test PlatformIO Project
        run: |
          cd Software
          pio test -e test

  check_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify legacy documentation remains retired
        run: |
          if [[ -d Documentation ]]; then
            echo "The retired in-repository documentation workspace was restored"
            exit 1
          fi
