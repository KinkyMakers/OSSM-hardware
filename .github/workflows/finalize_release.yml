name: Finalize validated production release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Validated 16 MiB (v2) control-plane release UUID
        required: true
        type: string
      release_id_4mb:
        description: Validated 4 MiB (v1) release UUID for the same version and commit
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: firmware-production
    env:
      GH_TOKEN: ${{ github.token }}
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify both variants' persisted release gates
        id: release
        env:
          RELEASE_ID_16MB: ${{ inputs.release_id }}
          RELEASE_ID_4MB: ${{ inputs.release_id_4mb }}
        run: |
          test "$RELEASE_ID_4MB" != "$RELEASE_ID_16MB"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $FIRMWARE_PUBLISH_TOKEN" \
            "https://dashboard.researchanddesire.com/api/internal/firmware/v1/releases/$RELEASE_ID_4MB?track=main" \
            --output release-4mb.json
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $FIRMWARE_PUBLISH_TOKEN" \
            "https://dashboard.researchanddesire.com/api/internal/firmware/v1/releases/$RELEASE_ID_16MB?track=main" \
            --output release-16mb.json
          python .github/scripts/release_workflow.py validate-pair \
            --release-4mb release-4mb.json --release-16mb release-16mb.json

      - name: Checkout exact release candidate
        env:
          RELEASE_BUILD_SHA: ${{ steps.release.outputs.build_sha }}
        run: |
          git checkout --detach "$RELEASE_BUILD_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_BUILD_SHA"
          git merge-base --is-ancestor "$RELEASE_BUILD_SHA" origin/main

      - name: Create idempotent numeric tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_SHA: ${{ steps.release.outputs.build_sha }}
        run: |
          git fetch --tags --force
          EXISTING_SHA=""
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$VERSION")"
          fi
          ACTION="$(python .github/scripts/release_workflow.py tag-action \
            --existing-sha "$EXISTING_SHA" \
            --candidate-sha "$CANDIDATE_SHA")"
          if [[ "$ACTION" == "create" ]]; then
            git config user.name "AJ"
            git config user.email "ajay.koenig@gmail.com"
            git tag "$VERSION" "$CANDIDATE_SHA"
            git push origin "$VERSION"
          fi

      - name: Create metadata-only GitHub release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_URL_4MB: ${{ steps.release.outputs.manifest_url_4mb }}
          MANIFEST_URL_16MB: ${{ steps.release.outputs.manifest_url_16mb }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("release-notes.md").write_text(
              "4 MiB firmware manifest: " + os.environ["MANIFEST_URL_4MB"] + "\n\n"
              "16 MiB firmware manifest: " + os.environ["MANIFEST_URL_16MB"] + "\n"
          )
          PY
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md
