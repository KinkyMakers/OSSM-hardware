name: Publish verified production legacy alias

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Validated immutable release UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    environment: firmware-production
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download and verify immutable release
        id: release
        run: |
          python .github/scripts/download_verified_release.py \
            --release-id "${{ inputs.release_id }}" \
            --track main \
            --device ossm \
            --hardware-variant v2 \
            --output firmware

      - name: Replace production Supabase aliases
        run: |
          for ALIAS in master production; do
            supabase storage rm "ss:///ossm-firmware/$ALIAS/firmware.bin" "ss:///ossm-firmware/$ALIAS/partitions.bin" "ss:///ossm-firmware/$ALIAS/bootloader.bin" \
              "ss:///ossm-firmware/$ALIAS/manifest.json" \
              "ss:///ossm-firmware/$ALIAS/version.json" --experimental --yes || true
            [[ ! -f "./firmware/firmware.bin" ]] || supabase storage cp "./firmware/firmware.bin" "ss:///ossm-firmware/$ALIAS/firmware.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            [[ ! -f "./firmware/partitions.bin" ]] || supabase storage cp "./firmware/partitions.bin" "ss:///ossm-firmware/$ALIAS/partitions.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            [[ ! -f "./firmware/bootloader.bin" ]] || supabase storage cp "./firmware/bootloader.bin" "ss:///ossm-firmware/$ALIAS/bootloader.bin" --content-type "application/octet-stream" --cache-control "no-cache" --experimental
            sed "s/{{ branchName }}/$ALIAS/g" .github/artifacts/manifest.json > ./firmware/legacy-manifest.json
            supabase storage cp ./firmware/legacy-manifest.json "ss:///ossm-firmware/$ALIAS/manifest.json" --content-type "application/json" --cache-control "no-cache" --experimental
            supabase storage cp ./firmware/version.json "ss:///ossm-firmware/$ALIAS/version.json" --content-type "application/json" --cache-control "no-cache" --experimental
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Mirror verified application to CloudFront origin
        run: aws s3 cp ./firmware/firmware.bin s3://ossm-update/firmware.bin --acl public-read

      - name: Summary
        run: echo "master and production now point to validated release ${{ inputs.release_id }} (v${{ steps.release.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

  rebuild-registry:
    needs: alias
    uses: ./.github/workflows/registry_rebuild.yml
    secrets: inherit
