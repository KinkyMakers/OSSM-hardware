name: Publish community firmware

# Builds from this community repository are unsigned community firmware, not
# official R+D releases (those come only from researchanddesire/OSSM). They are
# published to the public ossm-firmware bucket under kinkymakers/ only.

on:
  push:
    branches: [main, staging]
    paths:
      - "Software/**"
      - "scripts/release_version.py"
      - ".github/artifacts/manifest.json"
      - ".github/scripts/build_web_installer.py"
      - ".github/scripts/publish_community_firmware.sh"
      - ".github/scripts/release_workflow.py"
      - ".github/scripts/rebuild_registry.sh"
      - ".github/workflows/publish_firmware.yml"
      - ".github/workflows/registry_rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-firmware-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'KinkyMakers/OSSM-hardware'
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native unit tests
        working-directory: Software
        run: pio test -e test

      - name: Select track build
        run: python .github/scripts/release_workflow.py configure --branch "$GITHUB_REF_NAME"

      - name: Build V2 (16 MB)
        working-directory: Software
        run: pio run -e "$PIO_ENV"

      - name: Build V2 web installer
        run: |
          python .github/scripts/build_web_installer.py \
            --build-dir "Software/.pio/build/$PIO_ENV" \
            --output "Software/.pio/build/$PIO_ENV/web-installer.bin"

      - name: Checkout V1 firmware with Bluetooth
        if: github.ref_name == 'main'
        uses: actions/checkout@v4
        with:
          ref: 065c1c70d8be0b6ebe3edf536051ca542b793d70 # Legacy source; version is synchronized below.
          path: legacy-4mb

      - name: Pin legacy 4 MB dependencies
        if: github.ref_name == 'main'
        # The pinned legacy source asks for FastLED ^3.6.0; newer releases no
        # longer compile against it. 3.10.3 matches the current firmware.
        run: |
          sed -i 's#fastled/FastLED@^3.6.0#fastled/FastLED@3.10.3#' legacy-4mb/Software/platformio.ini
          grep -qx '    fastled/FastLED@3.10.3' legacy-4mb/Software/platformio.ini

      - name: Build V1 (4 MB)
        if: github.ref_name == 'main'
        run: |
          VERSION="$(python scripts/release_version.py read --header Software/src/constants/Version.h)"
          python scripts/release_version.py write --version "$VERSION" \
            --header legacy-4mb/Software/src/constants/Version.h --version-json legacy-4mb/version.json
          pio test --project-dir legacy-4mb/Software -e test
          pio run --project-dir legacy-4mb/Software -e production -t buildprog
          test "$(stat --format=%s legacy-4mb/Software/.pio/build/production/firmware.bin)" -le $((0x1E0000 - 0x4000))
          grep -qx 'CONFIG_BT_ENABLED=y' legacy-4mb/Software/sdkconfig.production
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE="4MB"' legacy-4mb/Software/sdkconfig.production
          python .github/scripts/build_web_installer.py --flash-size 4MB \
            --build-dir legacy-4mb/Software/.pio/build/production \
            --output legacy-4mb/Software/.pio/build/production/web-installer.bin

      - name: Publish to ossm-firmware/kinkymakers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
        run: |
          VERSION="$(python scripts/release_version.py read --header Software/src/constants/Version.h)"
          bash .github/scripts/publish_community_firmware.sh \
            "kinkymakers/v2/$GITHUB_REF_NAME" "Software/.pio/build/$PIO_ENV" "$VERSION"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            bash .github/scripts/publish_community_firmware.sh \
              "kinkymakers/v1/$GITHUB_REF_NAME" legacy-4mb/Software/.pio/build/production "$VERSION"
          fi

      - name: Summary
        run: |
          BASE="https://acjajruwevyyatztbkdf.supabase.co/storage/v1/object/public/ossm-firmware/kinkymakers"
          echo "Community firmware ${GITHUB_SHA::7} published (unsigned, not an official release):" >> "$GITHUB_STEP_SUMMARY"
          echo "- V2: $BASE/v2/$GITHUB_REF_NAME/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "- V1: $BASE/v1/$GITHUB_REF_NAME/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  rebuild-registry:
    needs: publish
    uses: ./.github/workflows/registry_rebuild.yml
    secrets: inherit
