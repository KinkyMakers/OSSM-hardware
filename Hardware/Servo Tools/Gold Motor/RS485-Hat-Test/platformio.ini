; RS485 hat bring-up + AIM57 (Gold Motor) parameter tool for OSSM V2.3 boards.
; Standalone test firmware - not part of the main OSSM firmware in /Software.

[platformio]
default_envs = rs485_hat_v23

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/eModbus/eModbus.git#v1.7.5stable

; OSSM V2.3 + RS485 hat (J9 header)
[env:rs485_hat_v23]
build_flags =
    ${env.build_flags}
    -D RS485_TX_PIN=22
    -D RS485_RX_PIN=33
    -D RS485_DE_PIN=2

; OSSM V2.5 (on-board transceiver) - same firmware, different pins
[env:ossm_v25]
build_flags =
    ${env.build_flags}
    -D RS485_TX_PIN=17
    -D RS485_RX_PIN=16
    -D RS485_DE_PIN=32
